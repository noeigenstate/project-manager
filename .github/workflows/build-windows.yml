name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-linux:
    name: Linux SSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies without desktop native builds
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test remote files and recovery state
        run: python3 -m unittest discover -s tests -p 'remote_worker_test.py' -v
      - name: Test real SSH and Linux PTY integration
        run: |
          node scripts/build-ssh-askpass.cjs
          node --test tests/ssh-config.test.cjs tests/ssh-connection.test.cjs tests/session-restore.test.cjs
  windows:
    name: Windows x64 build and desktop tests
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      binary: ${{ steps.version.outputs.binary }}
      installer: ${{ steps.version.outputs.installer }}
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate release version
        id: version
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid package version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The version tag must match package.json.'
          }
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "binary=Project-Grid-$version-win-x64.exe" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "installer=Project-Grid-Setup-$version-x64.exe" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Codex CLI for offline startup checks
        run: npm install --global @openai/codex@0.154.0 --no-audit --no-fund

      - name: Run unit and integration tests
        run: npm test

      - name: Build Windows installer and portable executable
        run: npm run dist

      - name: Verify installer and automatic update metadata
        run: node scripts/verify-update-artifacts.cjs

      - name: Verify desktop with actual terminal button clicks
        run: npm run test:desktop -- --packaged

      - name: Verify session recovery, clipboard and SSH desktop interaction
        run: npm run test:sessions -- --packaged

      - name: Create checksum and build notes
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $portable = "Project-Grid-$version-win-x64.exe"
          $installer = "Project-Grid-Setup-$version-x64.exe"
          $files = @($portable, $installer, "$installer.blockmap", 'latest.yml')
          $checksums = foreach ($name in $files) {
            $file = Join-Path release $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release file: $name" }
            $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $name"
          }
          $checksums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
          @(
            'Project Grid — Windows x64 installer and portable build'
            "Commit: $env:GITHUB_SHA"
            "Installer with automatic updates: $installer"
            "Portable edition: $portable"
            'Install the Setup executable to enable background update checks and downloads.'
            'Codex CLI must be installed separately on the target computer.'
          ) | Set-Content -LiteralPath release/BUILD-INFO.txt -Encoding utf8
          @(
            '## Windows build is ready'
            "- Installer: **$installer**"
            "- Portable: **$portable**"
            "- Commit: $env:GITHUB_SHA"
            '- Unit tests and packaged desktop tests passed, including actual Start terminal clicks.'
            '- Download **Project-Grid-windows-x64** from the Artifacts section of this run.'
            '- SHA-256 checksums and the automatic update feed are included.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload verified executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Project-Grid-windows-x64
          path: |
            release/Project-Grid-*.exe
            release/Project-Grid-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/BUILD-INFO.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Upload desktop test screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-test-screenshots
          path: |
            .test-output/desktop-*/*.png
            .test-output/sessions-*/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, remote-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the tested Windows build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Project-Grid-windows-x64
          path: release-assets

      - name: Verify and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
          RELEASE_BINARY: ${{ needs.windows.outputs.binary }}
          RELEASE_INSTALLER: ${{ needs.windows.outputs.installer }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          cd release-assets
          test -f "$RELEASE_BINARY"
          test -f "$RELEASE_INSTALLER"
          test -f latest.yml
          sha256sum --check SHA256SUMS.txt
          assets=("$RELEASE_BINARY" "$RELEASE_INSTALLER" "$RELEASE_INSTALLER.blockmap" latest.yml SHA256SUMS.txt BUILD-INFO.txt)

          cat > release-notes.md <<EOF
          Windows x64 installer and portable editions of Project Grid.

          **Recommended:** install **$RELEASE_INSTALLER** to enable automatic update checks and background downloads.
          For a portable copy, download **$RELEASE_BINARY**.
          Install Codex CLI on the computer or Linux SSH host where your project runs.

          - Multiple project terminals with completion alerts.
          - Fullscreen project view, collapsible file explorer, and frosted glass interface.
          - Compact top titlebar, brighter text and Ctrl-click terminal links.
          - Inline image and video viewing, large text pages and isolated HTML previews.
          - The installed edition downloads updates in the background. Restart and install from Settings when your tasks are finished.
          - Add local folders or Linux SSH projects using your existing VS Code SSH configuration.
          - Restore the latest Codex conversation on startup and continue interrupted turns automatically.
          - Select and copy terminal text, copy all scrollback from the context menu, and paste with Ctrl+V.
          - Verified with packaged desktop tests, session restart checks, and real Linux SSH/PTY integration.

          Commit: $GITHUB_SHA
          Build: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          SHA-256 checksums are attached in **SHA256SUMS.txt**.
          EOF

          flags=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi

          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets > existing-release.json 2>/dev/null; then
            # A rerun may finish its own draft, but must never replace a published binary.
            jq -e --arg commit "$GITHUB_SHA" '.targetCommitish == $commit' existing-release.json
            if [[ "$(jq -r '.isDraft' existing-release.json)" == 'false' ]]; then
              jq -e --arg binary "$RELEASE_BINARY" --arg installer "$RELEASE_INSTALLER" 'any(.assets[]; .name == $binary) and any(.assets[]; .name == $installer) and any(.assets[]; .name == "latest.yml")' existing-release.json
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --title "Project Grid $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --target "$GITHUB_SHA" --title "Project Grid $RELEASE_TAG" \
              --notes-file release-notes.md "${flags[@]}"
          fi

          echo "Release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
